# Phase 17D.1 — Image PUBLISHING + migrator readiness (credential-free half).
#
# Builds and pushes backend, migrator, web, and admin images to GHCR, and
# validates the migrator image against a DISPOSABLE PostgreSQL. It NEVER
# touches Azure, OIDC, Key Vault, Container Apps, any database, or any
# deployment/traffic action.
#
# Parameterized across staging and production:
#   - target_environment=staging    -> tags :<sha>, reads STAGING_NEXT_PUBLIC_*
#   - target_environment=production -> tags :prod-<sha>, reads PROD_NEXT_PUBLIC_*
#     (or explicit non-secret workflow_dispatch overrides) so production-baked
#     frontend URLs never overwrite staging SHA tags.
name: build-images

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target runtime environment for baked frontend NEXT_PUBLIC_* build args and GHCR tag namespace."
        type: choice
        options:
          - staging
          - production
        default: staging
      include_frontend:
        description: "Also build & publish web + admin (Gate B2 — requires NEXT_PUBLIC_* build args for the selected target_environment). Leave false for Gate B1 (backend + migrator only)."
        type: boolean
        default: false
      api_url:
        description: "Optional override for NEXT_PUBLIC_API_URL (https://.../api/v1). Leave blank to use target environment repo vars."
        type: string
        required: false
        default: ""
      web_app_url:
        description: "Optional override for web NEXT_PUBLIC_APP_URL (https://iriefishmongers.com for prod). Leave blank to use target environment repo vars."
        type: string
        required: false
        default: ""
      admin_app_url:
        description: "Optional override for admin NEXT_PUBLIC_APP_URL (https://admin.iriefishmongers.com for prod). Leave blank to use target environment repo vars."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/bernie-xtrinet1/irie-fishmongers

jobs:
  # ---- migrator readiness: build the migrator image and prove it applies all
  #      migrations against a FRESH, DISPOSABLE Postgres, then confirms state
  #      read-only. No seed. This gates publishing.
  migrator-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iriemig
          POSTGRES_PASSWORD: iriemig
          POSTGRES_DB: iriemig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iriemig"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATOR_DATABASE_URL: postgresql://iriemig:iriemig@localhost:5432/iriemig?schema=public
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v7

      - name: Build migrator image (local, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: migrator
          tags: irie-migrator:val
          push: false
          load: true

      - name: migrate deploy against fresh disposable Postgres (expect exit 0)
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e DATABASE_URL="$MIGRATOR_DATABASE_URL" \
            irie-migrator:val

      - name: migrate status is up-to-date, read-only (expect exit 0)
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e DATABASE_URL="$MIGRATOR_DATABASE_URL" \
            irie-migrator:val node_modules/.bin/prisma migrate status

  # ---- publish images to GHCR with BuildKit-native provenance + SBOM attestations ----
  publish:
    needs: migrator-validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v7

      - name: Resolve & validate build configuration
        id: build_cfg
        env:
          TARGET_ENV: ${{ inputs.target_environment }}
          INCLUDE_FRONTEND: ${{ inputs.include_frontend }}
          INPUT_API_URL: ${{ inputs.api_url }}
          INPUT_WEB_APP_URL: ${{ inputs.web_app_url }}
          INPUT_ADMIN_APP_URL: ${{ inputs.admin_app_url }}
          STAGING_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
          STAGING_WEB_URL: ${{ vars.STAGING_NEXT_PUBLIC_WEB_APP_URL }}
          STAGING_ADMIN_URL: ${{ vars.STAGING_NEXT_PUBLIC_APP_URL }}
          STAGING_ENV_NAME: ${{ vars.STAGING_NEXT_PUBLIC_ENVIRONMENT }}
          PROD_API_URL: ${{ vars.PROD_NEXT_PUBLIC_API_URL }}
          PROD_WEB_URL: ${{ vars.PROD_NEXT_PUBLIC_WEB_APP_URL }}
          PROD_ADMIN_URL: ${{ vars.PROD_NEXT_PUBLIC_ADMIN_APP_URL }}
          PROD_ENV_NAME: ${{ vars.PROD_NEXT_PUBLIC_ENVIRONMENT }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = "production" ]; then
            image_tag="prod-${GITHUB_SHA}"
            api_url="${INPUT_API_URL:-$PROD_API_URL}"
            web_app_url="${INPUT_WEB_APP_URL:-$PROD_WEB_URL}"
            admin_app_url="${INPUT_ADMIN_APP_URL:-$PROD_ADMIN_URL}"
            next_env="${PROD_ENV_NAME:-production}"
          else
            image_tag="${GITHUB_SHA}"
            api_url="${INPUT_API_URL:-$STAGING_API_URL}"
            web_app_url="${INPUT_WEB_APP_URL:-$STAGING_WEB_URL}"
            admin_app_url="${INPUT_ADMIN_APP_URL:-$STAGING_ADMIN_URL}"
            next_env="${STAGING_ENV_NAME:-staging}"
          fi

          if [ "$INCLUDE_FRONTEND" = "true" ]; then
            for pair in "api_url:$api_url" "admin_app_url:$admin_app_url"; do
              key="${pair%%:*}"
              val="${pair#*:}"
              if [ -z "$val" ]; then
                echo "::error::Missing required build URL '${key}' for target_environment='${TARGET_ENV}'."
                exit 1
              fi
            done
            if [ "$TARGET_ENV" = "production" ] && [ -z "$web_app_url" ]; then
              echo "::error::Missing web_app_url (or vars.PROD_NEXT_PUBLIC_WEB_APP_URL) for target_environment='production'."
              exit 1
            fi
            for val in "$api_url" "$web_app_url" "$admin_app_url"; do
              [ -n "$val" ] || continue
              case "$val" in
                https://*) ;;
                *) echo "::error::Frontend build URL must use https:// (got '${val}')."; exit 1 ;;
              esac
              case "$val" in
                *localhost*|*127.0.0.1*)
                  echo "::error::Frontend build URL must not reference localhost (${val})."; exit 1 ;;
              esac
              if [ "$TARGET_ENV" = "production" ]; then
                case "$val" in
                  *staging*|*agreeablerock-458effa7*)
                    echo "::error::Production build URL must not reference staging hostnames (${val})."; exit 1 ;;
                esac
              fi
            done
          fi

          {
            echo "image_tag=${image_tag}"
            echo "api_url=${api_url}"
            echo "web_app_url=${web_app_url}"
            echo "admin_app_url=${admin_app_url}"
            echo "next_env=${next_env}"
          } >> "$GITHUB_OUTPUT"
          echo "Target=${TARGET_ENV}, tag=${image_tag}, next_env=${next_env}, api_url=${api_url:-unset}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend (runner target)
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: runner
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/backend:${{ steps.build_cfg.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.iriefishmongers.env=${{ inputs.target_environment }}
          provenance: true
          sbom: true

      - name: Build & push migrator (migrator target)
        id: migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: migrator
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/migrator:${{ steps.build_cfg.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.iriefishmongers.env=${{ inputs.target_environment }}
          provenance: true
          sbom: true

      - name: Build & push web (target-specific public NEXT_PUBLIC_* baked at build time)
        id: web
        if: ${{ inputs.include_frontend }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/web:${{ steps.build_cfg.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.iriefishmongers.env=${{ steps.build_cfg.outputs.next_env }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.build_cfg.outputs.api_url }}
            NEXT_PUBLIC_APP_URL=${{ steps.build_cfg.outputs.web_app_url }}
            NEXT_PUBLIC_ENVIRONMENT=${{ steps.build_cfg.outputs.next_env }}
          provenance: true
          sbom: true

      - name: Build & push admin (target-specific public NEXT_PUBLIC_* baked at build time)
        id: admin
        if: ${{ inputs.include_frontend }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin-dashboard/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/admin:${{ steps.build_cfg.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.iriefishmongers.env=${{ steps.build_cfg.outputs.next_env }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.build_cfg.outputs.api_url }}
            NEXT_PUBLIC_APP_URL=${{ steps.build_cfg.outputs.admin_app_url }}
            NEXT_PUBLIC_ENVIRONMENT=${{ steps.build_cfg.outputs.next_env }}
          provenance: true
          sbom: true

      - name: Record immutable image@digest identities (published images only)
        env:
          TARGET_ENV: ${{ inputs.target_environment }}
          IMAGE_TAG: ${{ steps.build_cfg.outputs.image_tag }}
          INCLUDE_FRONTEND: ${{ inputs.include_frontend }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.admin.outputs.digest }}
        run: |
          set -euo pipefail
          images="backend:${BACKEND_DIGEST} migrator:${MIGRATOR_DIGEST}"
          if [ "$INCLUDE_FRONTEND" = "true" ]; then
            images="${images} web:${WEB_DIGEST} admin:${ADMIN_DIGEST}"
          fi
          fail=0
          {
            echo "### Published images — target ${TARGET_ENV}, source commit ${GITHUB_SHA}"
            echo ""
            echo "Tag pointer: \`${IMAGE_TAG}\`. Authoritative immutable identity: \`image@sha256:<digest>\`."
            echo ""
            echo "| image | tag pointer | immutable identity |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for entry in $images; do
            name="${entry%%:*}"
            digest="${entry#*:}"
            if [ -z "$digest" ]; then
              echo "FAIL: empty digest for required image ${name}"
              fail=1
              echo "| ${name} | ${IMAGE_TAG} | (MISSING DIGEST) |" >> "$GITHUB_STEP_SUMMARY"
            else
              ref="${IMAGE_NAMESPACE}/${name}@${digest}"
              echo "published ${name}: ${ref}"
              echo "| ${name} | ${IMAGE_TAG} | \`${ref}\` |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$fail" -eq 0 ]
