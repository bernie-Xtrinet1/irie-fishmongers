# Phase 17E.1V — Bicep compiler VALIDATION ONLY.
#
# Compiles, lints, and type-checks the committed Tier-1 Azure IaC
# (infrastructure/azure/**). It NEVER logs into Azure, uses no
# credentials/OIDC/secrets, and cannot create or modify any Azure resource:
# `az bicep` is a LOCAL transpiler/linter only. The job holds no Azure
# credential, so ARM mutation is impossible, not merely avoided.
#
# Tooling is the Azure CLI + Bicep already present on the GitHub-hosted
# ubuntu-latest (Ubuntu 24.04) runner image. The workflow does NOT install or
# download a compiler, so validation is reproducible against the declared
# runner image rather than a moving version.
name: bicep-validation

on:
  workflow_dispatch: {}
  push:
    paths:
      - infrastructure/azure/**
      - .github/workflows/bicep-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4

      - name: Record preinstalled Azure CLI + Bicep versions (fail if Bicep missing)
        run: |
          set -euo pipefail
          # Use ONLY the runner's preinstalled tooling. `az bicep version` exits
          # non-zero if Bicep is unexpectedly unavailable, failing the job.
          az version
          az bicep version

      - name: Lint Bicep (local; linter errors fail the job)
        run: |
          set -euo pipefail
          az bicep lint --file infrastructure/azure/main.bicep
          az bicep lint --file infrastructure/azure/modules/foundation.bicep
          az bicep lint --file infrastructure/azure/modules/containerApp.bicep

      - name: Compile main.bicep (resources, API versions, scopes, modules, outputs)
        run: |
          set -euo pipefail
          # --stdout prints ARM JSON to stdout and writes NO file into the repo.
          az bicep build --file infrastructure/azure/main.bicep --stdout > /dev/null

      - name: Compile modules standalone
        run: |
          set -euo pipefail
          az bicep build --file infrastructure/azure/modules/foundation.bicep --stdout > /dev/null
          az bicep build --file infrastructure/azure/modules/containerApp.bicep --stdout > /dev/null

      - name: Compile + resolve staging.bicepparam against main.bicep
        run: |
          set -euo pipefail
          az bicep build-params --file infrastructure/azure/staging.bicepparam --stdout > /dev/null

      # ---- Tier-3 (Phase 17F) application-deployment IaC ----
      - name: Lint Tier-3 Bicep (linter errors fail the job)
        run: |
          set -euo pipefail
          az bicep lint --file infrastructure/azure/tier3/main.bicep
          az bicep lint --file infrastructure/azure/tier3/modules/security.bicep
          az bicep lint --file infrastructure/azure/tier3/modules/data.bicep
          az bicep lint --file infrastructure/azure/tier3/modules/containerApp.bicep
          az bicep lint --file infrastructure/azure/tier3/modules/migratorJob.bicep

      - name: Compile Tier-3 main + modules
        run: |
          set -euo pipefail
          az bicep build --file infrastructure/azure/tier3/main.bicep --stdout > /dev/null
          az bicep build --file infrastructure/azure/tier3/modules/security.bicep --stdout > /dev/null
          az bicep build --file infrastructure/azure/tier3/modules/data.bicep --stdout > /dev/null
          az bicep build --file infrastructure/azure/tier3/modules/containerApp.bicep --stdout > /dev/null
          az bicep build --file infrastructure/azure/tier3/modules/migratorJob.bicep --stdout > /dev/null

      - name: Compile + resolve Tier-3 staging.bicepparam
        run: |
          set -euo pipefail
          az bicep build-params --file infrastructure/azure/tier3/staging.bicepparam --stdout > /dev/null

      - name: Static safety gate — only the five approved Tier-1 resource types
        run: |
          set -euo pipefail
          # Defense in depth, NOT a substitute for the compiler above. Scoped to
          # the Tier-1 templates only (Tier-3 deliberately adds more types).
          allowed="Microsoft.Resources/resourceGroups Microsoft.OperationalInsights/workspaces Microsoft.App/managedEnvironments Microsoft.App/containerApps Microsoft.Consumption/budgets"
          declared=$(grep -rhoE "Microsoft\.[A-Za-z]+/[A-Za-z]+" infrastructure/azure/main.bicep infrastructure/azure/modules --include=*.bicep | sort -u)
          for t in $declared; do
            case " $allowed " in
              *" $t "*) : ;;
              *) echo "FAIL: unexpected/deferred resource type in Tier-1: $t"; exit 1 ;;
            esac
          done
          echo "Tier-1 resource-type allowlist OK"

      - name: Static safety gate — Tier-3 resource-type allowlist
        run: |
          set -euo pipefail
          # Declaration-aware: scan ONLY Bicep `resource` declarations, extract
          # the quoted '<type>@<apiVersion>' (supporting any number of child
          # path segments, e.g. .../flexibleServers/databases), and check each
          # against the explicit allowlist. Type-name strings used inside
          # functions - e.g. subscriptionResourceId('Microsoft.Authorization/roleDefinitions', ...) -
          # are NOT resource declarations and are correctly excluded. `existing`
          # references are included in the scan (Microsoft.App/managedEnvironments
          # is the Tier-1 environment that Tier-3 references, not creates).
          allowed="Microsoft.KeyVault/vaults Microsoft.ManagedIdentity/userAssignedIdentities Microsoft.Authorization/roleAssignments Microsoft.DBforPostgreSQL/flexibleServers Microsoft.DBforPostgreSQL/flexibleServers/databases Microsoft.DBforPostgreSQL/flexibleServers/firewallRules Microsoft.Cache/redisEnterprise Microsoft.Cache/redisEnterprise/databases Microsoft.App/containerApps Microsoft.App/managedEnvironments Microsoft.App/jobs"
          declared=$(grep -rhE "^[[:space:]]*resource[[:space:]]" infrastructure/azure/tier3 --include=*.bicep \
            | grep -oE "'Microsoft\.[A-Za-z0-9]+(/[A-Za-z0-9]+)+@[0-9a-z-]+'" \
            | sed -E "s/^'//; s/@[0-9a-z-]+'\$//" | sort -u)
          for t in $declared; do
            case " $allowed " in
              *" $t "*) : ;;
              *) echo "FAIL: unexpected resource type in Tier-3: $t"; exit 1 ;;
            esac
          done
          echo "Tier-3 resource-type allowlist OK"

      - name: Static safety gate — no secret literals
        run: |
          set -euo pipefail
          if grep -rniE "password:\s*'|primarySharedKey:\s*'|(client|api)[-_]?secret:\s*'|['\"][A-Za-z0-9+/]{40,}={0,2}['\"]" infrastructure/azure --include=*.bicep; then
            echo "FAIL: possible secret literal in IaC"; exit 1
          fi
          echo "no secret literals"

      - name: Confirm no generated ARM JSON entered the tree
        run: |
          set -euo pipefail
          # --stdout must leave the working tree unchanged.
          if git status --porcelain | grep -E '\.json$'; then
            echo "FAIL: generated JSON present in working tree"; exit 1
          fi
          echo "workspace clean"
