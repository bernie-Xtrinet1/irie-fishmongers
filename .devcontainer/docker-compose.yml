# Devcontainer / GitHub Codespaces demo stack for Irie Fishmongers v1.0.0-rc.1.
#
# NOT for production. All values here are safe, non-secret DEMONSTRATION values
# for an ephemeral Codespace:
#  - the JWT secrets are throwaway demo strings (they only sign demo tokens in a
#    disposable environment),
#  - SENDGRID / Firebase credentials are intentionally invalid so no real email/push is ever
#    delivered (the providers reject them),
#  - WiPay points at the sandbox host with placeholder credentials; the demo
#    payment path is Cash On Delivery, which makes no external call.
# Real production secrets live in a secret manager and are never committed.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    networks:
      - iriefishmongers
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # --- backend ---
      PORT: '3001'
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://iriefishmongers:iriefishmongers@db:5432/iriefishmongers?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_SCHEDULER: 'true'
      JWT_ACCESS_SECRET: demo-access-secret-not-for-production-min-32-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: demo-refresh-secret-not-for-production-min-32-chars
      JWT_REFRESH_EXPIRES_IN: 7d
      APP_BASE_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3000,http://localhost:3002
      # External integrations disabled for the demo (see file header).
      WIPAY_API_URL: https://tx.wipayfinancial.com/plugins/payments
      WIPAY_ACCOUNT_NUMBER: demo-disabled
      WIPAY_API_KEY: demo-disabled
      SENDGRID_API_KEY: demo-disabled
      SENDGRID_FROM_EMAIL: demo@demo.iriefishmongers.test
      FIREBASE_PROJECT_ID: local-dev-project
      FIREBASE_CLIENT_EMAIL: firebase@local-dev-project.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY: '-----BEGIN PRIVATE KEY-----\ndemo-disabled\n-----END PRIVATE KEY-----\n'
      # Explicit marker read by scripts/start-codespaces-demo.sh so it knows it is
      # running inside THIS managed demo container - and may therefore safely unset
      # a stray NEXT_PUBLIC_* that would override .env.local. Preferred over a broad
      # /.dockerenv probe (which matches any unrelated container). Not a
      # NEXT_PUBLIC_* itself, so it is never inlined into a client bundle.
      IRIE_DEMO_CONTAINER: 'true'
      # --- frontends ---
      # NEXT_PUBLIC_* are intentionally NOT set here. Next.js inlines them into
      # the client bundle at build time, and a value in this container's
      # environment takes PRECEDENCE over apps/*/.env.local. Setting them here
      # would therefore override the per-environment values that
      # scripts/start-codespaces-demo.sh writes to each app's .env.local -
      # relative "/api/v1" in Codespaces (so the same-origin proxy works) or an
      # absolute localhost URL for a local devcontainer - and silently re-inject
      # a broken API URL into the compiled bundle. The start script is the single
      # source of truth for frontend env; see .devcontainer/README.md.

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - iriefishmongers
    environment:
      POSTGRES_USER: iriefishmongers
      POSTGRES_PASSWORD: iriefishmongers
      POSTGRES_DB: iriefishmongers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iriefishmongers']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - iriefishmongers
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  iriefishmongers:

volumes:
  pgdata:
